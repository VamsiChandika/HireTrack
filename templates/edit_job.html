{% extends 'base.html' %}
{% block title %}Edit Job | HireTrack{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2>Edit Job</h2>
    <form method="POST" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label>Job Title</label>
            <input type="text" name="title" class="form-control"
                   value="{{ job.title }}" required>
        </div>
        <div class="mb-3">
            <label>Company Name</label>
            <input type="text" name="company_name" class="form-control"
                   value="{{ job.company_name }}" required>
        </div>
        <div class="mb-3">
            <label>Job Description</label>
            <textarea name="description" class="form-control"
                      rows="4" required>{{ job.description }}</textarea>
        </div>
        <div class="mb-3">
            <label>Location</label>
            <input type="text" name="location" class="form-control"
                   value="{{ job.location }}" required>
        </div>
        <div class="mb-3">
            <label>Job Type</label>
            <select name="job_type" class="form-select" required>
                <option value="FULL_TIME" {% if job.job_type == 'FULL_TIME' %}selected{% endif %}>Full Time</option>
                <option value="PART_TIME" {% if job.job_type == 'PART_TIME' %}selected{% endif %}>Part Time</option>
                <option value="INTERNSHIP" {% if job.job_type == 'INTERNSHIP' %}selected{% endif %}>Internship</option>
                <option value="CONTRACT" {% if job.job_type == 'CONTRACT' %}selected{% endif %}>Contract</option>
            </select>
        </div>
        <div class="mb-3">
            <label>Minimum Salary</label>
            <input type="number" name="salary_min" class="form-control"
                   value="{{ job.salary_min|default_if_none:'' }}">
        </div>
        <div class="mb-3">
            <label>Maximum Salary</label>
            <input type="number" name="salary_max" class="form-control"
                   value="{{ job.salary_max|default_if_none:'' }}">
        </div>
        <div class="mb-3">
            <label>Experience Required (Years)</label>
            <input type="number" name="experience_required" class="form-control"
                   value="{{ job.experience_required }}" min="0" required>
        </div>
        <div class="mb-3">
            <label>Required Skills</label>
            <textarea name="skills_required" class="form-control"
                      rows="3" required>{{ job.skills_required }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Update Job</button>
        <a href="{% url 'recruiter_jobs' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
